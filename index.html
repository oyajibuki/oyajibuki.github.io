    store:'https://apps.apple.com/jp/app/nonstop-%E7%B9%8B%E3%81%8E%E3%83%9F%E3%83%A5%E3%83%BC%E3%82%B8%E3%83%83%E3%82%AF%E3%83%97%E3%83%AC%E3%82%A4%E3%83%A4%E3%83%BC/id6794858698',
    links:[{t:'紹介ページ',u:'/nonstop/'}], account:'不要（アカウント登録なしで利用可）' },

  { no:12, name:'Toonify Studio', cat:'写真/ビデオ', date:'2026-08-19', status:'released',
    desc:'写真を選ぶだけで背景を切り抜き、文字入れまで自動。1枚の写真から表情違いの8枚がそろう、LINEスタンプ用の素材メーカー。',
    icon:ICON+'Purple211/v4/b6/c3/de/b6c3de86-cace-6ae8-719b-7a3399ff230c/AppIcon-0-0-1x_U007ephone-0-1-85-220.png/100x100bb.jpg',
    store:'https://apps.apple.com/jp/app/toonify-studio/id6799540460',
    links:[{t:'紹介ページ',u:'/toonifystudio/'},{t:'サポート',u:'/toonifystudio/support.html'}],
    account:'不要（端末内で完結）' },

  { no:13, name:'TuneDrop — 気持ちが漂う空', cat:'ソーシャルネットワーキング', date:'2026-08-19', status:'released',
    desc:'診断でうまれたあなたの分身が空を漂い、寝ているあいだに人の気持ちに触れて、朝に日記を持って帰ってきます。放った言葉は24時間で消えます。',
    icon:ICON+'Purple211/v4/5d/41/06/5d4106b8-1d75-6802-ad5e-75429453deac/AppIcon-0-0-1x_U007epad-0-1-85-220.png/100x100bb.jpg',
    store:'https://apps.apple.com/jp/app/tunedrop-%E6%B0%97%E6%8C%81%E3%81%A1%E3%81%8C%E6%BC%82%E3%81%86%E7%A9%BA/id6797012799',
    links:[{t:'紹介ページ',u:'/tunedrop/'},{t:'サポート',u:'/tunedrop/support.html'}],
    account:'必要（アプリ内アカウント／退会機能あり）' },

  /* ── 審査・申請中 ── */
  { no:14, name:'TuneDrop Focus', cat:'仕事効率化', date:'', status:'review',
    desc:'集中しているあいだ、あなたの精霊が空を登っていく。青空から夕焼け、星空、そして宇宙へ。到達した高度が、そのままTuneDropの精霊のお金と経験値になります。',
    icon:'/tunedropfocus/icon.png',
    links:[{t:'紹介ページ',u:'/tunedropfocus/'},{t:'サポート',u:'/tunedropfocus/support.html'}],
    account:'必要（TuneDrop と同じアカウント基盤）' },

  { no:15, name:'会議分給メーター', cat:'ビジネス', date:'', status:'review',
    desc:'会議中に消えていく人件費をタクシーメーターのように表示。参加者の役職と人数を入れるだけ。1時間ごとのチャイムで長引く会議に気づけます。',
    icon:'/meetingcost/icon.jpg',
    links:[{t:'紹介ページ',u:'/meetingcost/'},{t:'サポート',u:'/meetingcost/support.html'}],
    account:'不要（端末内で完結）' },

  { no:16, name:'怒り箱 AngerBOX', cat:'ヘルスケア/フィットネス', date:'', status:'review',
    desc:'マジでブチギレ5秒前に開くアプリ。叩く・爆破する・破く・溶かす・混ぜる・消す。6通りのやり方で怒りをぶつけ、その記録をあとから振り返れます。',
    icon:'/angerbox/icon.png',
    links:[{t:'紹介ページ',u:'/angerbox/'},{t:'サポート',u:'/angerbox/support.html'}],
    account:'不要（端末内で完結）' },
];

const TABS = [
  { id:'released', label:'🚀 公開済み', note:'App Store で配信中のアプリです。番号はリリース順。' },
  { id:'review',   label:'⏳ 審査・申請中', note:'Apple に提出済み、または再申請待ちのアプリです。結果が出しだい更新します。' },
  { id:'log',      label:'📊 記録', note:'100本チャレンジの進み具合。SNS にそのまま貼れる数字です。' },
];

/* ============================================================ */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const released = APPS.filter(a => a.status === 'released');
const review   = APPS.filter(a => a.status === 'review');
const fmtDate = d => d ? d.replace(/^(\d{4})-(\d{2})-(\d{2})$/, '$1.$2.$3') : '';

const STATS_CALC = (() => {
  const rows = released.map(a => {
    const m = STATS.apps[a.no] || { dl:0, redl:0 };
    return { no:a.no, name:a.name, ...m };
  });
  const sum = k => rows.reduce((t, r) => t + r[k], 0);
  return { rows, dl:sum('dl'), redl:sum('redl') };
})();

function appCard(a){
  const iconHtml = a.icon ? `<img src="${esc(a.icon)}" alt="" loading="lazy">` : esc(a.emoji || '📱');
  const status = a.status === 'released'
    ? `<span class="pill p-ok">公開中</span>`
    : `<span class="pill p-wait">審査・申請中</span>`;
  const dateRow = a.date
    ? `<div class="row"><div class="row-k">リリース</div><div class="row-v">${fmtDate(a.date)}</div></div>`
    : `<div class="row"><div class="row-k">リリース</div><div class="row-v">審査結果待ち</div></div>`;
  const links = [
    a.store ? `<a class="b b1" href="${esc(a.store)}" target="_blank" rel="noopener">App Store</a>` : '',
    ...(a.links || []).map(l => `<a class="b b2" href="${esc(l.u)}"${/^https?:/.test(l.u) ? ' target="_blank" rel="noopener"' : ''}>${esc(l.t)}</a>`)
  ].filter(Boolean).join('');

  return `<article class="app">
    <div class="app-hd">
      <div class="icon">${iconHtml}</div>
      <div>
        <p class="app-name"><span class="no">#${a.no}</span>${esc(a.name)}</p>
        <p class="app-cat">${esc(a.cat)} ・ ${status}</p>
      </div>
    </div>
    <p class="desc">${esc(a.desc)}</p>
    <div class="rows">
      ${dateRow}
      <div class="row"><div class="row-k">アカウント</div><div class="row-v">${esc(a.account)}</div></div>
      ${SHOW_STATS && a.status === 'released' && STATS.apps[a.no]
        ? `<div class="row"><div class="row-k">ダウンロード</div><div class="row-v num">${STATS.apps[a.no].dl} 件<span style="color:var(--sub)">（更新・再DL ${STATS.apps[a.no].redl} 件）</span></div></div>`
        : ''}
    </div>
    ${links ? `<div class="links">${links}</div>` : ''}
  </article>`;
}

function dlChart(){
  const mo = STATS.monthly;
  const mx = Math.max(...mo.map(x => x.dl), 1);
  return `<div class="chart">${mo.map(x => `<div class="bar-w">
      <div class="bar-n">${x.dl}</div>
      <div class="bar${x.partial ? ' w' : ''}" style="height:${(x.dl / mx * 100).toFixed(1)}%"></div>
      <div class="bar-m">${x.m.replace('-', '.')}${x.partial ? '*' : ''}</div>
    </div>`).join('')}</div>`;
}

function logView(){
  const first = released[0], last = released[released.length-1];
  const days = Math.round((new Date(last.date) - new Date(first.date)) / 86400000);
  const pace = (days / released.length).toFixed(1);
  const tl = released.map(a =>
    `<li><div class="tl-d">${fmtDate(a.date)}</div><div class="tl-t">#${a.no} ${esc(a.name)}</div></li>`).join('');
  const S = STATS_CALC;
  const shareText =
`iOSアプリ100本チャレンジ 進捗
公開済み ${released.length}本 / 審査中 ${review.length}本
初リリース ${fmtDate(first.date)} → 最新 ${fmtDate(last.date)}
平均 ${pace}日に1本ペース
累計ダウンロード ${S.dl}件（${STATS.period}）
残り ${100 - released.length - review.length}枠
https://oyajibuki.github.io/`;

  return `<h2 class="label">月別リリース</h2>
    ${monthChart()}
    <h2 class="label">サマリー</h2>
    <div class="money-grid">
      <div class="m hero-m"><div class="m-l">累計ダウンロード</div><div class="m-v num">${S.dl} 件</div><div class="m-s">${STATS.period}</div></div>
      <div class="m"><div class="m-l">更新・再ダウンロード</div><div class="m-v num">${S.redl} 件</div><div class="m-s">合計 ${S.dl + S.redl} 件</div></div>
      <div class="m"><div class="m-l">初リリースからの日数</div><div class="m-v num">${days} 日</div><div class="m-s">${fmtDate(first.date)} から</div></div>
      <div class="m"><div class="m-l">平均ペース</div><div class="m-v num">${pace} 日に1本</div><div class="m-s">13本を公開</div></div>
      <div class="m"><div class="m-l">残り</div><div class="m-v num">${100 - released.length - review.length} 枠</div><div class="m-s">100本まで</div></div>
    </div>
    <h2 class="label">月別ダウンロード</h2>
    ${dlChart()}
    <p class="sec-note" style="margin-top:10px">* 2026.09 は 9月1〜4日の4日分のみ。</p>
    <h2 class="label">アプリ別ダウンロード</h2>
    <div class="tbl-w"><table>
      <thead><tr><th>アプリ</th><th>新規DL</th><th>更新・再DL</th><th>合計</th></tr></thead>
      <tbody>${[...S.rows].sort((a,b) => b.dl - a.dl).map(r => `<tr>
        <td>#${r.no} ${esc(r.name)}</td><td class="num">${r.dl}</td>
        <td class="num">${r.redl}</td><td class="num">${r.dl + r.redl}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>合計</td><td class="num">${S.dl}</td><td class="num">${S.redl}</td><td class="num">${S.dl + S.redl}</td></tr></tfoot>
    </table></div>
    <h2 class="label">リリース履歴</h2>
    <ul class="tl">${tl}</ul>
    <div class="share">
      <h3>📣 SNS用テキスト</h3>
      <pre id="shareText">${esc(shareText)}</pre>
      <button class="copy" id="copyBtn">コピーする</button>
    </div>`;
}

function render(id){
  const t = TABS.find(x => x.id === id) || TABS[0];
  const view = document.getElementById('view');
  let h = `<p class="sec-note">${esc(t.note)}</p>`;

  if (id === 'released') h += `<div class="grid">${released.map(appCard).join('')}</div>`;
  else if (id === 'review') h += `<div class="grid">${review.map(appCard).join('')}</div>`;
  else h += logView();

  view.innerHTML = h;
  document.querySelectorAll('.tab').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.id === id)));
  location.hash = id;

  const btn = document.getElementById('copyBtn');
  if (btn) btn.onclick = () => {
    navigator.clipboard.writeText(document.getElementById('shareText').textContent)
      .then(() => { btn.textContent = 'コピーしました ✓'; setTimeout(() => btn.textContent = 'コピーする', 1800); })
      .catch(() => { btn.textContent = 'コピーできませんでした'; });
  };
}

/* 初期描画 */
(function init(){
  const counts = { released: released.length, review: review.length, log: null };
  const tabs = TABS.slice();
  document.getElementById('tabs').innerHTML = tabs.map(t =>
    `<button class="tab" role="tab" data-id="${t.id}" aria-selected="false">${t.label}${
      counts[t.id] != null ? `<span class="n">${counts[t.id]}</span>` : ''}</button>`).join('');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    render(b.dataset.id);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  const done = released.length, wait = review.length;
  const stats = [
    { v: done, l: '公開済み' },
    { v: wait, l: '審査・申請中' },
    { v: done + wait, l: '着手ずみ' },
    { v: 100 - done - wait, l: '100本まで' },
  ];
  document.getElementById('stats').innerHTML = stats.map(s =>
    `<div class="stat"><div class="stat-v">${s.v}</div><div class="stat-l">${s.l}</div></div>`).join('');
  const pct = (done + wait);
  document.getElementById('gaugeFill').style.width = pct + '%';
  document.getElementById('gaugeL').textContent = `${done + wait} / 100 本（${pct}%）`;

  const latest = released.map(a => a.date).sort().pop();
  document.getElementById('upd').textContent = `最終更新：${fmtDate(latest)} 時点のリリース情報`;

  const hash = location.hash.replace('#','');
  render(tabs.some(t => t.id === hash) ? hash : 'released');
})();
</script>
</body>
</html>
