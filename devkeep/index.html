<!DOCTYPE html>
<html lang="ja">
<head>

  <title>DevKeep — サポートページ</title>
  <link rel="stylesheet" href="/common.css">
</head>
<body>
  <div class="back">← <a href="/">アプリ一覧に戻る</a></div>
  <div class="app-header">
    <div class="app-icon" id="app-icon"></div>
    <div>
      <h1>DevKeep</h1>
      <p class="app-tagline">開発者向けコードスニペット管理</p>

  <a class="btn-appstore" href="https://apps.apple.com/jp/app/devkeep/id6777493725" target="_blank">App Store で開く</a>

  <div class="contact-box">
    <p>ご不明な点・バグ報告・ご要望は以下よりお送りください。</p>

    <h2>Q. スニペットが消えてしまった</h2>
    <p>アプリを削除するとデータも削除されます。エクスポート機能をご活用ください。</p>
  </div>
  <div class="faq-item">
    <h2>Q. 検索で見つからない</h2>
    <p>タイトルと本文が検索対象です。タグを活用すると整理しやすくなります。</p>
  </div>
  <hr>
  <footer><p>DevKeep &nbsp;·&nbsp; <a href="/">アプリ一覧</a> &nbsp;·&nbsp; <a href="/form/">お問い合わせ</a></p></footer>
