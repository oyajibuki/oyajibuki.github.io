<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Game</title>
<meta name="description" content="公的統計にもとづき、ランダムに決まった職業で一度きりの仕事人生を生きるシミュレーション / A career simulation based on official labor statistics">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=0.2.7">
</head>
<body>

<!-- ===== ホーム ===== -->
<section id="home" class="screen active">
  <div class="wrap">
    <div class="langbar"><span class="topline" data-i18n="home.topline"></span><nav class="langs" id="langTabs"></nav></div>
    <div class="hero">
      <div>
        <h1 class="title" data-i18n-html="home.title"></h1>
        <p class="lead" data-i18n="home.lead"></p>
        <div class="cta-row">
          <button class="btn primary big" id="btnStart" data-i18n="home.start"></button>
          <button class="btn" data-go="zukan" data-i18n="home.zukan"></button>
          <button class="btn" data-go="memorial" data-i18n="home.memorial"></button>
        </div>
        <div class="setting">
          <span class="muted" data-i18n="home.len"></span>
          <div class="seg" id="lenSeg">
            <button data-sec="3" data-i18n="home.len.short"></button>
            <button data-sec="6" class="on" data-i18n="home.len.mid"></button>
            <button data-sec="14" data-i18n="home.len.long"></button>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-h" data-i18n="home.dist"></div>
        <div class="muted small" data-i18n="home.distNote"></div>
        <div id="majorBars"></div>
        <div class="muted small" style="margin-top:8px" data-i18n="home.distFoot"></div>
      </div>
    </div>
    <div class="grid3">
      <div class="card"><div class="card-h" data-i18n="home.c1.h"></div><p class="small" data-i18n="home.c1"></p></div>
      <div class="card"><div class="card-h" data-i18n="home.c2.h"></div><p class="small" data-i18n="home.c2"></p></div>
      <div class="card"><div class="card-h" data-i18n="home.c3.h"></div><p class="small" data-i18n-html="home.c3"></p></div>
    </div>
  </div>
</section>

<!-- ===== 入職届 ===== -->
<section id="contract" class="screen">
  <div class="wrap narrow">
    <div class="doc">
      <div class="doc-h"><span data-i18n="c.doc"></span><span class="mono" id="cNo"></span></div>
      <div class="doc-b">
        <div class="muted small" data-i18n="c.name"></div>
        <h2 class="doc-name" id="cName"></h2>
        <p id="cLead" class="lead2"></p>
        <div class="kv" id="cKv"></div>
        <div class="rare" id="cRare"></div>
        <div class="card-h" style="margin-top:20px" data-i18n="c.peers"></div>
        <div id="cPeers" class="peers"></div>
        <div class="muted small" data-i18n="c.peersNote"></div>
        <div class="cta-row end">
          <button class="btn" data-go="home" data-i18n="cancel"></button>
          <button class="btn primary" id="btnBegin" data-i18n="c.begin"></button>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ===== プレイ ===== -->
<section id="play" class="screen">
  <header class="bar">
    <div class="bar-l">
      <span class="logo" data-i18n-html="brandHtml"></span>
      <span class="age"><b id="pAge"></b></span>
      <span class="muted small" id="pSub"></span>
    </div>
    <div class="progress"><div id="pProg"></div></div>
    <div class="ctrls">
      <button class="btn sm" id="btnPause"></button>
      <span class="seg sm" id="spdSeg">
        <button data-x="1" class="on">1×</button><button data-x="2">2×</button><button data-x="4">4×</button><button data-x="8">8×</button>
      </span>
      <button class="btn sm" id="btnAuto" data-i18n="p.auto"></button>
      <button class="btn sm" id="btnQuit" data-i18n="p.quit"></button>
    </div>
  </header>
  <div class="wrap play">
    <aside>
      <div class="id-card">
        <div class="id-h"><span data-i18n="p.record"></span><span id="idYear"></span></div>
        <div class="id-b">
          <div class="avatar" id="idAvatar"></div>
          <div>
            <div class="id-name" id="idName"></div>
            <dl class="dl" id="idDl"></dl>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-h"><span data-i18n="p.stats"></span> <span class="muted small">0–100</span></div>
        <div id="stats"></div>
        <div class="money" id="money"></div>
        <div class="card-h" style="margin-top:14px" data-i18n="p.lics"></div>
        <div id="lics" class="chips"></div>
      </div>
      <div class="card">
        <div class="card-h" data-i18n="p.family"></div>
        <dl class="dl fam" id="family"></dl>
      </div>
      <div class="card">
        <div class="card-h" data-i18n="p.peers"></div>
        <div id="peers" class="peers"></div>
      </div>
    </aside>
    <main>
      <div class="scene" id="scene">
        <div class="scene-icon" id="sceneIcon"></div>
        <div>
          <div class="scene-job" id="sceneJob"></div>
          <div class="muted small" id="sceneMeta"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-h"><span data-i18n="p.focus"></span> <span class="muted small" id="focusHint"></span></div>
        <div class="focus" id="focus"></div>
        <div id="studyBox" class="study hidden">
          <label class="small muted" data-i18n="p.studyTarget"></label>
          <select id="studySel"></select>
          <div class="meter"><div id="studyMeter"></div></div>
          <div class="small muted" id="studyText"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-h"><span data-i18n="p.chart"></span> <span class="muted small" id="chartUnit"></span></div>
        <svg id="chart" viewBox="0 0 600 140" preserveAspectRatio="none"></svg>
      </div>
      <div class="card">
        <div class="card-h"><span data-i18n="p.log"></span> <span class="muted small" data-i18n="p.logNew"></span></div>
        <ol class="log" id="log"></ol>
      </div>
    </main>
  </div>
</section>

<!-- ===== エンディング ===== -->
<section id="ending" class="screen">
  <div class="wrap narrow">
    <div class="doc">
      <div class="doc-h"><span data-i18n="e.doc"></span><span class="mono" id="eNo"></span></div>
      <div class="doc-b">
        <div class="muted small" data-i18n="c.name"></div>
        <h2 class="doc-name" id="eName"></h2>
        <p class="epitaph" id="eEpitaph"></p>
        <p id="eSummary" class="lead2"></p>
        <p id="eFamily" class="lead2 muted"></p>
        <div class="kv" id="eKv"></div>
        <svg id="eChart" viewBox="0 0 600 140" preserveAspectRatio="none"></svg>
        <div class="card-h" style="margin-top:16px" data-i18n="e.jobs"></div>
        <div id="eJobs" class="chips"></div>
        <div class="card-h" style="margin-top:16px" data-i18n="e.peers"></div>
        <div id="ePeers" class="peers"></div>
        <div class="passbox">
          <div>
            <div class="card-h" data-i18n="e.pass.h"></div>
            <p class="small muted" data-i18n="e.pass.d"></p>
          </div>
          <button class="btn primary" id="btnPass" data-i18n="e.pass.btn"></button>
        </div>
        <label class="small muted" for="eWord" style="display:block;margin-top:16px" data-i18n="e.word"></label>
        <input id="eWord" class="input" maxlength="60" data-i18n-ph="e.wordPh">
        <div class="cta-row end">
          <button class="btn" data-go="zukan" data-i18n="e.toZukan"></button>
          <button class="btn primary" id="btnSave" data-i18n="e.save"></button>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ===== 職歴証明書パスの作品 ===== -->
<section id="pass" class="screen">
  <div class="wrap narrow">
    <div class="row-h">
      <h2 class="h2" id="passTitle"></h2>
      <button class="btn" id="passBack" data-go="ending" data-i18n="back"></button>
    </div>
    <div class="card">
      <div class="card-h"><span data-i18n="pass.img"></span> <span class="muted small">1080×1350</span></div>
      <canvas id="passCanvas" class="pass-canvas"></canvas>
      <div class="cta-row"><button class="btn primary" id="dlImage" data-i18n="pass.imgSave"></button></div>
    </div>
    <div class="card">
      <div class="card-h"><span data-i18n="pass.pdf"></span> <span class="muted small">A4</span></div>
      <p class="small muted" data-i18n="pass.pdfNote"></p>
      <div class="cta-row"><button class="btn primary" id="dlPdf" data-i18n="pass.pdfMake"></button></div>
    </div>
    <div class="card">
      <div class="card-h"><span data-i18n="pass.video"></span> <span class="muted small">1080×1920 · 20s</span></div>
      <p class="small muted" data-i18n="pass.videoNote"></p>
      <div class="cta-row"><button class="btn primary" id="mkVideo" data-i18n="pass.videoMake"></button></div>
      <div class="small muted" id="videoStatus"></div>
      <div id="videoOut" class="video-out"></div>
    </div>
  </div>
</section>

<!-- ===== 職業図鑑 ===== -->
<section id="zukan" class="screen">
  <div class="wrap">
    <div class="row-h">
      <h2 class="h2"><span data-i18n="z.title"></span> <span class="muted small" id="zCount"></span></h2>
      <button class="btn" data-go="home" data-i18n="back"></button>
    </div>
    <p class="small muted" data-i18n-html="z.desc"></p>
    <p class="small muted" data-i18n-html="z.src"></p>
    <input id="zSearch" class="input" data-i18n-ph="z.search">
    <div id="zTree"></div>
  </div>
</section>

<!-- ===== メモリアル ===== -->
<section id="memorial" class="screen">
  <div class="wrap">
    <div class="row-h">
      <h2 class="h2" data-i18n="mem.title"></h2>
      <button class="btn" data-go="home" data-i18n="back"></button>
    </div>
    <p class="small muted" data-i18n="mem.note"></p>
    <div id="mList" class="mlist"></div>
  </div>
</section>

<!-- ===== 職歴証明書パスの購入 ===== -->
<div id="buyModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-k" data-i18n="pass.buy.k"></div>
    <h3 id="buyTitle"></h3>
    <ul class="small buy-list">
      <li data-i18n="pass.buy.i1"></li>
      <li data-i18n="pass.buy.i2"></li>
      <li data-i18n="pass.buy.i3"></li>
    </ul>
    <p class="small muted" data-i18n="pass.buy.n1"></p>
    <p class="small muted" data-i18n="pass.buy.n2"></p>
    <div class="choices">
      <button id="buyGo"><span data-i18n="pass.buy.go"></span> <b id="buyPrice"></b></button>
      <button id="buyClose" data-i18n="cancel"></button>
    </div>
  </div>
</div>

<!-- 職歴書PDF用（印刷時だけ表示） -->
<div id="printArea"></div>

<!-- ===== モーダル ===== -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-k" id="mKind"></div>
    <h3 id="mTitle"></h3>
    <p id="mText"></p>
    <textarea id="mInput" class="input hidden" rows="2" maxlength="80" data-i18n-ph="ask.note"></textarea>
    <div id="mChoices" class="choices"></div>
  </div>
</div>

<script src="js/i18n.js?v=0.2.7"></script>
<script src="js/boot.js?v=0.2.7"></script>
</body>
</html>
