  <div class="app-header">
    <div class="app-icon" id="app-icon"></div>
    <div>
      <h1>運動クエスト</h1>
      <p class="app-tagline">毎日の運動を習慣化するRPG</p>

  <a class="btn-appstore" href="https://apps.apple.com/jp/app/%E9%81%8B%E5%8B%95%E3%82%AF%E3%82%A8%E3%82%B9%E3%83%88/id6765534901" target="_blank">App Store で開く</a>

  </div>
  <div class="faq-item">
    <h2>Q. 連続日数がリセットされた</h2>
    <p>1日運動を記録しなかった場合、連続日数が少し減少します。完全リセットではないので引き続き継続しましょう。</p>
  </div>
